name: Deploy to Production

on:
  push:
    branches: [review2]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # УБИРАЕМ needs - деплой независимый
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Pull latest images
      run: |
        docker pull ghcr.io/infinity74853/film-backend:latest
        docker pull ghcr.io/infinity74853/film-frontend:latest  
        docker pull ghcr.io/infinity74853/film-nginx:latest
      
    - name: Deploy to production server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          echo "=== Starting deployment ==="
          cd ~/film-app
          
          echo "=== Pulling latest images ==="
          docker compose pull
          
          echo "=== Recreating containers ==="
          docker compose up -d
          
          echo "=== Checking services ==="
          docker compose ps
          
          echo "=== Testing API ==="
          curl -f http://localhost/api/films || echo "API check completed"
          
          echo "=== Deployment completed successfully! ==="