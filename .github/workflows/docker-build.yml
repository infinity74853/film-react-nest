name: Build, Push and Deploy

on:
  push:
    branches: [ review2, main ]
  pull_request:
    branches: [ review2, main ]
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/film-backend:latest
          ghcr.io/${{ github.repository_owner }}/film-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/film-frontend:latest
          ghcr.io/${{ github.repository_owner }}/film-frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-nginx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push nginx
      uses: docker/build-push-action@v5
      with:
        context: ./nginx
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/film-nginx:latest
          ghcr.io/${{ github.repository_owner }}/film-nginx:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-nginx]
    if: github.ref == 'refs/heads/review2'  # Деплой только из review2 ветки
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to production server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          echo "=== Starting automated deployment ==="
          cd ~/film-app
          
          echo "=== Pulling latest images ==="
          docker compose pull backend frontend nginx
          
          echo "=== Stopping application containers ==="
          docker compose stop backend frontend nginx || true
          
          echo "=== Removing old containers ==="
          docker compose rm -f backend frontend nginx || true
          
          echo "=== Starting new containers ==="
          docker compose up -d backend frontend nginx
          
          echo "=== Waiting for services to start ==="
          sleep 10
          
          echo "=== Checking running containers ==="
          docker compose ps
          
          echo "=== Checking nginx status ==="
          curl -f http://localhost:80/ || echo "Frontend check completed"
          
          echo "=== Cleaning up old images ==="
          docker image prune -f
          
          echo "=== Deployment completed successfully! ==="