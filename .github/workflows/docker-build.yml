name: Build and Push Docker Images

on:
  push:
    branches: [ review2 ]
  pull_request:
    branches: [ review2 ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push backend
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/film-backend:latest ./backend
        docker push ghcr.io/${{ github.repository_owner }}/film-backend:latest

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: build-backend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push frontend
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/film-frontend:latest ./frontend
        docker push ghcr.io/${{ github.repository_owner }}/film-frontend:latest