name: CI/CD Pipeline

on:
  push:
    branches: [review2]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Docker
      uses: docker/setup-buildx-action@v3
      
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: |
          ghcr.io/infinity74853/film-backend:latest
          ghcr.io/infinity74853/film-backend:${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Docker
      uses: docker/setup-buildx-action@v3
      
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: |
          ghcr.io/infinity74853/film-frontend:latest
          ghcr.io/infinity74853/film-frontend:${{ github.sha }}

  build-nginx:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Docker
      uses: docker/setup-buildx-action@v3
      
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push nginx
      uses: docker/build-push-action@v5
      with:
        context: ./nginx
        push: true
        tags: |
          ghcr.io/infinity74853/film-nginx:latest
          ghcr.io/infinity74853/film-nginx:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-nginx]
    
    steps:
    - name: Wait for images to be available
      run: sleep 30  # Даем время образам стать доступными в GHCR
      
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}  # теперь infinity
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd ~/film-app
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u infinity74853 --password-stdin
          
          echo "=== Pulling images with retry ==="
          # Пробуем несколько раз с задержкой
          for i in 1 2 3; do
            if docker compose pull; then
              echo "=== Images pulled successfully ==="
              break
            else
              echo "=== Pull failed, retrying in 10 seconds... ==="
              sleep 10
            fi
          done
          
          echo "=== Recreating containers ==="
          docker compose up -d
          
          echo "=== Checking services ==="
          docker compose ps
          
          echo "=== Deployment completed! ==="