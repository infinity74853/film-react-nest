name: CI/CD Pipeline

on:
  push:
    branches: [review2]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: infinity74853

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        component: [backend, frontend, nginx]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push ${{ matrix.component }}
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.component }}
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/film-${{ matrix.component }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/film-${{ matrix.component }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/review2'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to production server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          echo "=== Starting deployment ==="
          cd ~/film-app
          
          echo "=== Logging in to GitHub Container Registry ==="
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ env.IMAGE_NAMESPACE }} --password-stdin
          
          echo "=== Pulling latest images ==="
          docker compose pull
          
          echo "=== Recreating containers ==="
          docker compose up -d
          
          echo "=== Checking services ==="
          docker compose ps
          
          echo "=== Waiting for services to start ==="
          sleep 15
          
          echo "=== Testing API ==="
          curl -f http://localhost/api/films || echo "API check completed"
          
          echo "=== Checking nginx ==="
          curl -f http://localhost/ || echo "Frontend check completed"
          
          echo "=== Cleaning up ==="
          docker image prune -f
          
          echo "=== Deployment completed successfully! ==="